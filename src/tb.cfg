# ld65 config for the netcode. Three outputs land in one file, in this order
# (tools/build_rom.py splits it): bank 8 up to its $BFE0 tail (the build
# stamps the reset stub, bank ID and vectors there), then the two stretches
# of the fixed bank's free space that the NMI and scheduler hooks live in.
# WRAM is the cart's $6000-$7FFF, requested by the NES 2.0 header.
MEMORY {
    RINGS: start = $6000, size = $0300, type = rw, file = "";
    STAT:  start = $6300, size = $0100, type = rw, file = "";
    RAM:   start = $6400, size = $0300, type = rw, file = "";
    IMG:   start = $6700, size = $1100, type = rw, file = "";
    TRACE: start = $7800, size = $0800, type = rw, file = "";
    B8:    start = $8000, size = $3FE0, type = ro, file = %O, fill = yes, fillval = $FF;
    FIXA:  start = $C290, size = $0110, type = ro, file = %O, fill = yes, fillval = $00;
    FIXB:  start = $CD96, size = $0169, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    RINGS:  load = RINGS, type = bss;
    STAT:   load = STAT,  type = bss;
    BSS:    load = RAM,   type = bss;
    IMG:    load = IMG,   type = bss;
    TRACE:  load = TRACE, type = bss;
    B8HEAD: load = B8,    type = ro, start = $8000;
    CODE:   load = B8,    type = ro;
    RODATA: load = B8,    type = ro;
    FIXA:   load = FIXA,  type = ro;
    FIXB:   load = FIXB,  type = ro;
}
